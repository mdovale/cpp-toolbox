# catalog.yaml — index of record for cpp-toolbox.
# CMake, Sphinx, and the README table follow this file.
# Schema: BLUEPRINT.md. Do not add an in-tree entry without a row here.
#
# kind:       tutorial | how-to | example | exercise | project | template
# topic:      one of the vocabulary below (add a topic only on purpose)
# difficulty: 1 intro … 3 needs numerical care … 5 project-scale
# std:        20 | 23  (C++20 floor; 23 only when the lesson needs it)
# status:     planned | draft | complete   (catalog slice)
# prose:      draft | complete             (book chapter; omit on planned)
#
# Topics (controlled vocabulary):
#   language      — ownership, types, ranges, error handling, C++ as used in labs
#   numerics      — floating point, stability, quadrature, ODE/PDE sketches
#   linear-algebra
#   io            — files, CSV, structured scientific data
#   parallelism   — parallel STL, threads, as used in engineering codes
#   performance   — measurement, locality, practical speed
#   testing       — testing numerical and scientific code
#   build         — CMake, sanitizers, how we compile
#   interop       — C APIs, Python extensions (later)

version: 1

topics:
  - language
  - numerics
  - linear-algebra
  - io
  - parallelism
  - performance
  - testing
  - build
  - interop

